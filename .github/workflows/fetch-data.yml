# Jednou měsíčně (a ručně tlačítkem „Run workflow“) stáhne data z otevřených zdrojů,
# zvaliduje je, spustí testy a změny commitne – rozdíly v datech jsou pak vidět v gitu.
# Commit spustí i nasazení (deploy.yml).
name: Aktualizace dat

on:
  schedule:
    - cron: '0 5 3 * *' # 3. den v měsíci v 5:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fetch-data
      - run: npm run validate-data
      - run: npm test
      - name: Commit změn v datech
        run: |
          if git diff --quiet -- data/generated; then
            echo "Data se nezměnila."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated
          git commit -m "Aktualizace dat $(date -u +%Y-%m-%d)"
          git push
